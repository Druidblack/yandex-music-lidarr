# Markdownlint configuration.  Defaults are sensible; relax a handful of rules
# that conflict with the way we write technical research notes.
default: true

# Line length: technical docs include long URLs and code references.
MD013:
  line_length: 200
  code_blocks: false
  tables: false
  headings: false

# Inline HTML is occasionally useful for admonitions and details/summary.
MD033: false

# Multiple consecutive blank lines: allow up to two.
MD012:
  maximum: 2

# Bare URLs in technical notes are acceptable.
MD034: false

# First-line heading not strictly required (notes may start with frontmatter or
# a callout).
MD041: false
