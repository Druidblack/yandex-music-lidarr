name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # Lidarr.Core ships AssemblyVersion=1.0.0 on the published host (Hotio's
  # release pipeline overrides the upstream "10.0.0.*" wildcard).  Pin every
  # build to the same value so our plugin's TypeRefs point at the same
  # Lidarr.Core the runtime has loaded.
  ASSEMBLY_VERSION: "1.0.0"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
          global-json-file: src/global.json

      - name: Restore
        run: |
          dotnet restore src/Lidarr.Plugin.YandexMusic.sln \
              --property:NuGetAudit=false \
              --property:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} \
              --property:FileVersion=${{ env.ASSEMBLY_VERSION }}

      - name: Build (Release)
        run: |
          dotnet build src/Lidarr.Plugin.YandexMusic.sln \
              --configuration Release \
              --no-restore \
              --property:NuGetAudit=false \
              --property:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} \
              --property:FileVersion=${{ env.ASSEMBLY_VERSION }} \
              --property:Deterministic=true

      - name: Test
        run: |
          dotnet test src/Lidarr.Plugin.YandexMusic.sln \
              --configuration Release \
              --no-build \
              --property:NuGetAudit=false \
              --property:AssemblyVersion=${{ env.ASSEMBLY_VERSION }} \
              --property:FileVersion=${{ env.ASSEMBLY_VERSION }} \
              --logger "trx;LogFileName=test-results.trx"

      - name: Smoke check merged DLL
        run: |
          PLUGIN_DLL=_plugins/net8.0/Lidarr.Plugin.YandexMusic/Lidarr.Plugin.YandexMusic.dll
          test -f "$PLUGIN_DLL" || { echo "Merged plugin DLL missing"; exit 1; }
          SIZE_KB=$(stat --printf='%s' "$PLUGIN_DLL" | awk '{ printf "%d\n", $1 / 1024 }')
          echo "Merged plugin DLL: ${SIZE_KB} KiB"
          if [ "$SIZE_KB" -gt 5120 ]; then
            echo "Merged DLL is unexpectedly large (>5 MiB) - ILRepack scrub probably broke." >&2
            exit 1
          fi
          # Output dir must contain exactly the plugin DLL plus its PDB.
          EXTRA=$(find "$(dirname "$PLUGIN_DLL")" -mindepth 1 -maxdepth 1 \
                   -not -name 'Lidarr.Plugin.YandexMusic.dll' \
                   -not -name 'Lidarr.Plugin.YandexMusic.pdb')
          if [ -n "$EXTRA" ]; then
            echo "Unexpected files in plugin output: $EXTRA" >&2
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/test-results.trx"
          retention-days: 14

      - name: Upload plugin artefact
        uses: actions/upload-artifact@v4
        with:
          name: Lidarr.Plugin.YandexMusic.net8.0
          path: _plugins/net8.0/Lidarr.Plugin.YandexMusic/
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !ext/**
            !**/node_modules/**

      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@v2
